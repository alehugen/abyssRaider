<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: o layout usa env(safe-area-inset-*) para o notch e a barra de gestos. Zoom liberado. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AbyssRaider</title>
    <meta name="description" content="Organize raids de Aion 2: vincule seu personagem, monte parties e marque a agenda." />
    <!-- Cor da barra do sistema: o script abaixo e o useTheme trocam conforme o tema. -->
    <meta name="theme-color" content="#020713" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/pwa-64x64.png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- iOS: app instalado pela Tela de Início -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AbyssRaider" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Fontes vêm do próprio app (@fontsource, em src/main.ts): abrem offline e sem outro site. -->
    <style>
      /* Tela de abertura (some quando o Vue monta): logo no fundo do tema, sem quadro branco. */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot img { width: 72px; height: 72px; border-radius: 18px; animation: boot 1.2s ease-in-out infinite alternate; }
      @keyframes boot { from { opacity: 0.55; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
    </style>
    <script>
      // Aplica o tema antes da renderização para evitar "flash".
      // Manter em sincronia com THEME_STORAGE_KEY / THEMES / SYSTEM_THEME / DEFAULT_PREFERENCE.
      ;(function () {
        var themes = { elyos: 'light', asmodian: 'dark', abyss: 'dark' }
        var colors = { elyos: '#fcf9f2', asmodian: '#0d0816', abyss: '#020713' } // themeColor em themes.ts
        var id
        try {
          id = localStorage.getItem('abyss-raider:theme')
        } catch (e) {}
        if (id === 'system') {
          id = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'asmodian' : 'elyos'
        }
        if (!themes[id]) id = 'abyss' // padrão para quem ainda não escolheu
        var root = document.documentElement
        root.dataset.theme = id
        root.classList.toggle('dark', themes[id] === 'dark')
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', colors[id])
        root.style.backgroundColor = colors[id] // fundo certo antes do CSS do app carregar
      })()
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot" aria-hidden="true"><img src="/pwa-192x192.png" alt="" /></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
