<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AbyssRaider</title>
    <meta name="description" content="Organize raids de Aion 2: vincule seu personagem, monte parties e marque a agenda." />
    <link rel="icon" href="/favicon.ico" sizes="16x16" />
    <link rel="icon" type="image/png" href="/aion2-icon.png" sizes="154x154" />
    <link rel="apple-touch-icon" href="/aion2-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap"
    />
    <script>
      // Aplica o tema antes da renderização para evitar "flash".
      // Manter em sincronia com THEME_STORAGE_KEY / THEMES / SYSTEM_THEME.
      ;(function () {
        var themes = { elyos: 'light', asmodian: 'dark', abyss: 'dark' }
        var id
        try {
          id = localStorage.getItem('abyss-raider:theme')
        } catch (e) {}
        if (!themes[id]) {
          id = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'asmodian' : 'elyos'
        }
        var root = document.documentElement
        root.dataset.theme = id
        root.classList.toggle('dark', themes[id] === 'dark')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
