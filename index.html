<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AbyssRaider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <script>
      // Aplica o tema antes da renderização para evitar "flash".
      // Manter em sincronia com THEME_STORAGE_KEY / THEMES / SYSTEM_THEME.
      ;(function () {
        var themes = { elyos: 'light', asmodian: 'dark', abyss: 'dark' }
        var id
        try {
          id = localStorage.getItem('abyss-raider:theme')
        } catch (e) {}
        if (!themes[id]) {
          id = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'asmodian' : 'elyos'
        }
        var root = document.documentElement
        root.dataset.theme = id
        root.classList.toggle('dark', themes[id] === 'dark')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
